name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # Twice a week, two hours after the Android repo rebuilds the card index (new sets), so the site's
  # copy of it keeps up.
  schedule:
    - cron: '0 5 * * 1,4'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # 22.15+ for the tests: they run the TypeScript sources directly (see tests/register.mjs).
          node-version: 24
          cache: npm
      - run: npm ci
      # The sync scenarios (tests/sync). A failure stops the deploy.
      - run: npm test
      - run: npm run build
        env:
          # Supabase project URL + anon (publishable) key. The anon key ends up in the public bundle by
          # design; row-level security on library_items is what keeps each account's data private.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
      # GitHub Pages serves static files with no server-side routing — copying the SPA shell to
      # 404.html means a direct link/refresh on e.g. /decks/abc123 still loads the app, which then
      # reads the real URL from the browser and lets React Router take it from there.
      - run: cp dist/index.html dist/404.html
      # The scanner's card index and its model (built by tools/card-index): ~20 MB, too big for git,
      # so they live on the Android repo's card-index-v1 release and are copied in here. Without them
      # the scanner still works, matching a card's art online the old way.
      - name: Card index
        run: |
          mkdir -p dist/card-index
          for f in card-index.bin card-model.onnx card-index.json; do
            curl -fsSL -o "dist/card-index/$f" "https://github.com/bellavaffa-cmd/mtg-companion-app/releases/download/card-index-v1/$f"               || { echo "::warning::$f isn't published yet"; rm -f "dist/card-index/$f"; }
          done
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
